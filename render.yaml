# Render Blueprint — deploys the Wallet backend as a Node web service.
# Database: external (Supabase). Set DATABASE_URL + CORS_ORIGIN in the Render UI.
#
# Deploy:
#   1. Push this file to main.
#   2. Render dashboard -> New -> Blueprint -> point to this repo.
#   3. Fill in the secret env vars (DATABASE_URL, CORS_ORIGIN) when prompted.
services:
  - type: web
    name: wallet-backend
    runtime: node
    plan: free
    region: singapore        # change to oregon / frankfurt / etc. if you prefer
    rootDir: backend
    buildCommand: npm install && npm run build && npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # entered in the Render dashboard, not committed
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random value once
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false          # set to your GitHub Pages origin
