name: Build and Deploy Vite React App

on:
  push:
    branches:
      - main 

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Forces all subsequent steps to execute commands inside the frontend directory
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Targets the lockfile inside the frontend subfolder for caching
          cache-dependency-path: frontend/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Compile Production Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ANALYTICS_ID: ${{ secrets.VITE_ANALYTICS_ID }}
        run: npx vite build 

      - name: Deploy Compiled Files to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist # Targets the dist folder inside the frontend directory
          branch: gh-pages